# Checks and tests in a container: `pnpm docker:test` (clean up with
# `pnpm docker:down`). The source is bind-mounted and dependencies live in
# named volumes, so Linux builds of native packages never mix with the host's.
# The app itself runs on the host (`pnpm dev`): Electron needs a display.
name: tagtape-dev

services:
  test:
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
    image: tagtape-dev:local
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - desktop_node_modules:/app/apps/desktop/node_modules
      - shared_node_modules:/app/packages/shared/node_modules
      - website_node_modules:/app/apps/website/node_modules
      - pnpm_store:/pnpm-store

volumes:
  node_modules:
  desktop_node_modules:
  shared_node_modules:
  website_node_modules:
  pnpm_store:
