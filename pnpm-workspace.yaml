packages:
  - apps/*
  - packages/*

# Supply chain, written out explicitly (most are pnpm's defaults) so a change
# of defaults can't quietly weaken them:
# - new releases are installed only once they're a day old (time for a
#   compromised version to be noticed and pulled)
# - a package that used to be published with provenance can't suddenly
#   arrive without it
# - transitive dependencies can't come from git or tarball URLs
# - only the packages below may run install scripts
minimumReleaseAge: 1440
# Spotcraft is our own project, released with provenance; its kit is adopted
# on the day it ships. Its dependencies still wait the full day.
minimumReleaseAgeExclude:
  - '@spotcraft/kit'
trustPolicy: no-downgrade
blockExoticSubdeps: true
strictDepBuilds: true

allowBuilds:
  esbuild: true
  lightningcss: true
  sharp: true

catalog:
  '@types/node': ^24.19.2
  typescript: ^7.0.2
  vitest: ^5.1.0
  zod: ^4.6.7
