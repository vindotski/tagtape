packages:
  - desktop
  - shared
  - website

# Supply chain, written out explicitly (most are pnpm's defaults) so a change
# of defaults can't quietly weaken them:
# - new releases are installed only once they're a day old (time for a
#   compromised version to be noticed and pulled)
# - a package that used to be published with provenance can't suddenly
#   arrive without it
# - transitive dependencies can't come from git or tarball URLs
# - only the packages below may run install scripts
minimumReleaseAge: 1440
trustPolicy: no-downgrade
blockExoticSubdeps: true
strictDepBuilds: true

allowBuilds:
  electron: true
  # Only needed for Squirrel installers; TagTape builds NSIS ones.
  electron-winstaller: false
  esbuild: true
  lightningcss: true
  sharp: true

catalog:
  '@types/node': ^26.6.6
  typescript: ^7.0.2
  vitest: ^5.1.0
  zod: ^4.6.7

# Security overrides, each scoped to the vulnerable range only. Remove one
# once the dependency that pins the old version allows the fixed release.
overrides:
  # GHSA-g3hv-75wg-m249 (DoS), via shadcn → ts-morph → @ts-morph/common,
  # which still asks for minimatch ^10.
  'minimatch@>=7 <11.0.1': ^11.0.1
