# TagTape on a single server: the app image behind Caddy (automatic HTTPS).
# Lives in /opt/tagtape on the server, next to Caddyfile and .env.
# The deploy workflow copies this file over on every deploy, so edit it here.
name: tagtape

services:
  app:
    image: ${TAGTAPE_IMAGE:-vindotski/tagtape}:${TAGTAPE_TAG:?set TAGTAPE_TAG in .env}
    restart: unless-stopped
    # No published ports: only Caddy reaches the app, on the internal network.
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Only Caddy reaches the app, and Caddy sets X-Forwarded-For itself:
      # trust it for the client address (per-client limits).
      TRUST_PROXY: "1"
      POW_COST: ${POW_COST:-}
      JOB_TTL_MIN: ${JOB_TTL_MIN:-30}
      MAX_ACTIVE_PROBES: ${MAX_ACTIVE_PROBES:-4}
      MAX_QUEUED_JOBS: ${MAX_QUEUED_JOBS:-20}
      MAX_ACTIVE_STREAMS: ${MAX_ACTIVE_STREAMS:-2}
      MAX_QUEUED_STREAMS: ${MAX_QUEUED_STREAMS:-10}
      TRACK_CONCURRENCY: ${TRACK_CONCURRENCY:-2}
      MAX_DIRECT_MB: ${MAX_DIRECT_MB:-300}
      MAX_DOWNLOADS_PER_JOB: ${MAX_DOWNLOADS_PER_JOB:-5}
      MAX_STORED_JOBS: ${MAX_STORED_JOBS:-500}
      CHECK_TIMEOUT_SEC: ${CHECK_TIMEOUT_SEC:-180}
      MAX_JOBS_PER_CLIENT_HOUR: ${MAX_JOBS_PER_CLIENT_HOUR:-30}
      MAX_CHECKING_JOBS_PER_CLIENT: ${MAX_CHECKING_JOBS_PER_CLIENT:-2}
      MAX_DOWNLOADS_PER_CLIENT: ${MAX_DOWNLOADS_PER_CLIENT:-2}
      # Two Node processes (web + API) share the memory limit with ffmpeg.
      NODE_OPTIONS: --max-old-space-size=${APP_NODE_HEAP_MB:-384}
    # Redeploys stop running downloads (nothing is stored to resume); users retry.
    stop_grace_period: 30s
    # Hardening. The app writes nothing to disk (media streams through), so
    # the filesystem is read-only; /tmp is a small in-memory scratch space.
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: ${APP_MEMORY:-1g}
    cpus: ${APP_CPUS:-2}
    pids_limit: 256
    ulimits:
      nofile: { soft: 4096, hard: 4096 }

  caddy:
    image: caddy:2.11.7@sha256:36c24ad91a7ff7bc4c87fe22bfa8df3c4b18da0773d73fc12ee2c52b98c0bb7e
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=8m,noexec,nosuid,nodev
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE] # ports 80 and 443
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      TAGTAPE_DOMAIN: ${TAGTAPE_DOMAIN:?set TAGTAPE_DOMAIN in .env}
    # Without a healthcheck, `docker compose up --wait` treats a crash-looping
    # Caddy as "running"; the admin API only answers once the config loaded.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates: keep across redeploys
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
