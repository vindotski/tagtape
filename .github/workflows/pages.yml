name: Website

# Builds apps/website/ and publishes it on GitHub Pages. Only from main, and only
# when the site (or what it reads from packages/shared/) changed; also on demand.
# Needs, once, in the repository settings: Pages → Source "GitHub Actions",
# and `main` allowed in the github-pages environment (the default branch is dev).
on:
  push:
    branches: [main]
    paths:
      - apps/website/**
      - packages/shared/**
      - pnpm-lock.yaml
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      # Only what the site needs: the desktop app's dependencies (Electron
      # and its download) have no part in a static site.
      - run: pnpm install --frozen-lockfile --filter "@tagtape/website..."
      - run: pnpm --filter @tagtape/website build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/website/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
