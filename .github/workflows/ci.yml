name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to commit SHAs (tags can be moved).
jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No version: reads "packageManager" from package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `biome ci` never writes files and reports problems as PR annotations.
      - name: Biome
        run: pnpm exec biome ci

      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  api-image:
    name: API image (build + smoke test)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          tags: tagtape-api:ci
          load: true
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Smoke test the container
        run: |
          docker run -d --name api -p 127.0.0.1:4000:4000 \
            -e API_TOKEN="$(openssl rand -hex 32)" tagtape-api:ci
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:4000/health && break
            sleep 1
          done
          echo
          # Health proves yt-dlp and ffmpeg run inside the image.
          curl -sf http://127.0.0.1:4000/health | grep -q '"status":"ok"'
          # Everything except health and archive downloads needs the token.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:4000/jobs)" = 401
          # Runs as non-root with tini as PID 1.
          test "$(docker exec api id -u)" != 0
          test "$(docker exec api cat /proc/1/comm)" = tini

      - name: Container logs
        if: failure()
        run: docker logs api
