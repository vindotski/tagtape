name: CI

on:
  push:
    branches: [main, dev]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to commit SHAs (tags can be moved).
jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No version: reads "packageManager" from package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `biome ci` never writes files and reports problems as PR annotations.
      - name: Biome
        run: pnpm exec biome ci

      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  image:
    name: Image (build + smoke test)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          tags: tagtape:ci
          load: true
          push: false
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max

      - name: Smoke test the container
        run: |
          docker run -d --name app -p 127.0.0.1:3000:3000 tagtape:ci
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:3000/ && break
            sleep 1
          done
          # The web app renders, and its stylesheet actually exists
          # (a client/server CSS hash mismatch once shipped an unstyled page).
          page="$(curl -sf http://127.0.0.1:3000/)"
          grep -q '<title>TagTape' <<<"$page"
          css="$(grep -o '/assets/[^"]*\.css' <<<"$page" | head -1)"
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000$css")" = 200
          # Downloads go through the web origin; unknown jobs are 404.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/download/00000000-0000-4000-8000-000000000000)" = 404
          # The API is internal only: not reachable from outside the container...
          # (`! cmd` would never fail the step under errexit, so check explicitly.)
          if curl -s --max-time 2 http://127.0.0.1:4000/health; then
            echo "The API port is reachable from outside the container" >&2
            exit 1
          fi
          # ...but healthy inside (yt-dlp + ffmpeg run) and token-protected.
          docker exec app node -e "
            (async () => {
              const h = await (await fetch('http://127.0.0.1:4000/health')).json();
              if (h.status !== 'ok') throw new Error(JSON.stringify(h));
              const r = await fetch('http://127.0.0.1:4000/jobs', { method: 'POST' });
              if (r.status !== 401) throw new Error('POST /jobs without token: ' + r.status);
            })().catch((e) => { console.error(e); process.exit(1); });"
          # Non-root, with tini as PID 1.
          test "$(docker exec app id -u)" != 0
          test "$(docker exec app cat /proc/1/comm)" = tini

      - name: Container logs
        if: failure()
        run: docker logs app

  # Publishes vindotski/tagtape to Docker Hub, only from main and version tags,
  # and only after every check above has passed.
  # Needs repo variable DOCKERHUB_USERNAME and secret DOCKERHUB_TOKEN.
  publish:
    name: Publish image to Docker Hub
    needs: [checks, image]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # arm64 is built under QEMU emulation on the amd64 runner.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # main → latest; v1.2.3 → 1.2.3, 1.2, 1; every publish → sha-abc1234.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: vindotski/tagtape
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=TagTape
            org.opencontainers.image.description=YouTube links to a ZIP of ID3-tagged MP3s. Web app + API (yt-dlp, ffmpeg) in one image. https://tagtape.app
            org.opencontainers.image.licenses=Unlicense
            org.opencontainers.image.url=https://tagtape.app

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # One version for web + API: shown by /health and in the image label.
          build-args: TAGTAPE_VERSION=${{ steps.meta.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: |
            type=gha,scope=image
            type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max
