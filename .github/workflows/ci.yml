name: CI

on:
  push:
    branches: [main, dev]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to commit SHAs (tags can be moved).
jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      installers: ${{ steps.scope.outputs.installers }}
    steps:
      # Installers are built on four platforms. On dev, main and tags, always.
      # On a pull request, only when it touches something that ends up in
      # them: a change to the website or the docs needs no installers.
      - name: Decide whether to build installers
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          build=true
          if [ "$EVENT" = pull_request ]; then
            # If the list can't be read, build: never skip by accident.
            if files="$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')"; then
              pattern='^(apps/desktop/|packages/shared/|\.github/workflows/ci\.yml$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|tsconfig\.base\.json$)'
              echo "$files" | grep -qE "$pattern" || build=false
            fi
          fi
          echo "installers=$build" >> "$GITHUB_OUTPUT"
          echo "Build installers: $build"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A release tag must match the version in package.json (bump it first).
      # Checked here, once, before any installer is built.
      - name: Check the version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          REF: ${{ github.ref }}
        run: |
          pkg="$(grep -m1 '"version"' package.json | sed -E 's/.*"version": *"([^"]+)".*/\1/')"
          if [ "${REF#refs/tags/v}" != "$pkg" ]; then
            echo "::error::Tag ${REF#refs/tags/} doesn't match package.json version $pkg"
            exit 1
          fi

      # No version: reads "packageManager" from package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      # The pnpm store is restored everywhere but saved only from dev and
      # main: a copy per pull request (about 1 GB across the platforms) put
      # the repository over GitHub's 10 GB cache limit, and evictions then
      # made the caches miss.
      - name: Find the pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pnpm-cache
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: >-
          (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
          && steps.pnpm-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}

      # `biome ci` never writes files and reports problems as PR annotations.
      - name: Biome
        run: pnpm exec biome ci

      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # One installer per platform, built on that platform, then started once to
  # prove the packaged app renders and its bundled ffmpeg and yt-dlp run.
  # Installers are unsigned (macOS: ad-hoc).
  package:
    name: Package (${{ matrix.name }})
    needs: checks
    if: needs.checks.outputs.installers == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
            app: apps/desktop/dist/mac-arm64/TagTape.app/Contents/MacOS/TagTape
          - name: macOS x64
            os: macos-15-intel
            app: apps/desktop/dist/mac/TagTape.app/Contents/MacOS/TagTape
          - name: Windows x64
            os: windows-2025
            app: apps/desktop/dist/win-unpacked/TagTape.exe
          - name: Linux x64
            os: ubuntu-24.04
            app: apps/desktop/dist/linux-unpacked/tagtape
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      # The pnpm store is restored everywhere but saved only from dev and
      # main: a copy per pull request (about 1 GB across the platforms) put
      # the repository over GitHub's 10 GB cache limit, and evictions then
      # made the caches miss.
      - name: Find the pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pnpm-cache
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: >-
          (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
          && steps.pnpm-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}

      # The pipeline's tests on this platform too: process handling and file
      # naming differ between them.
      - run: pnpm --filter @tagtape/desktop test

      # Fetches the pinned ffmpeg and yt-dlp (checksum-verified), builds the
      # app and the installers.
      - run: pnpm package

      - name: Smoke test the packaged app
        env:
          TAGTAPE_SMOKE_TEST: "1"
          APP: ${{ matrix.app }}
        run: |
          # The app prints its result and exits with 0 (the page rendered, both
          # programs ran) or 1.
          if [ "$RUNNER_OS" = Linux ]; then
            # No display on the runner, and its AppArmor profile blocks the
            # Chromium sandbox for unpacked apps: both are CI-only workarounds.
            xvfb-run -a "$APP" --no-sandbox
          else
            "$APP"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb

  # On a version tag: a draft GitHub Release with every installer attached.
  # Publishing it (which makes it the "latest" the website links to) is a
  # manual step.
  release:
    name: Draft release
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*
          merge-multiple: true
          path: installers

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          (cd installers && rm -f SHA256SUMS.txt && sha256sum -- * > SHA256SUMS.txt)
          # Run again for the same tag (a re-run after a failed upload): the
          # draft is there already, so replace its files instead of failing.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" --clobber installers/*
          else
            gh release create "$TAG" --draft --verify-tag --title "TagTape ${TAG#v}" \
              --notes "See CHANGELOG.md for what changed. Installers are unsigned: the website explains how to open them." \
              installers/*
          fi
