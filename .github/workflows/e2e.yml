name: End-to-end (real MP3 links)

# Converts public MP3 files through the image weekly (and on demand), with the
# real ffmpeg and network, so breakage shows up here before users see it.
# Scheduled runs test main (production), even though they start from the
# default branch (dev); a manual run tests the branch it's started on.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'schedule' && 'main' || '' }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          tags: tagtape:e2e
          load: true
          push: false
          cache-from: type=gha,scope=image

      # The API is internal in the image; API_HOST + a fixed token expose it for the test.
      - name: Start the app
        run: |
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$TOKEN"
          echo "TAGTAPE_E2E_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          docker run -d --name api -p 127.0.0.1:4100:4000 \
            -e API_HOST=0.0.0.0 -e API_TOKEN="$TOKEN" tagtape:e2e
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:4100/health && break; sleep 1; done

      - name: Convert real MP3 links
        env:
          TAGTAPE_E2E_URL: http://127.0.0.1:4100
        run: pnpm --filter @tagtape/api exec vitest run src/e2e.test.ts

      - name: Container logs
        if: failure()
        run: docker logs api
